name: CI
on:
  push:
  pull_request:

# Sandbox parity (G-SANDBOX): runs in an ephemeral container with TEST keys only.
# Live TossPayments credentials are never available to CI.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (pnpm@10.x). Do NOT also set `version:`
      # here — pnpm/action-setup@v4 errors on a dual spec (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Full machine gate: lint + typecheck + unit tests + executable guardrails.
      - run: pnpm check

      # Eval harness (reports purchase-flow metrics; does not fail the build yet).
      - run: pnpm eval

      # NOTE: the Playwright E2E suite is a LOCAL Definition-of-Done gate (AGENTS.md), not run in CI.
      # It drives `next dev`, whose on-demand per-route compilation is pathologically slow on a CI
      # runner (observed 30min+ / effective hang on the first remote run). Run `pnpm test:e2e` locally
      # per feature. To bring E2E back into CI later, serve a PRODUCTION build (`next build && next
      # start`) as the Playwright webServer instead of `next dev` (no on-demand compile → fast).
