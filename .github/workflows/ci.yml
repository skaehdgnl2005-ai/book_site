name: CI
on:
  push:
  pull_request:

# Sandbox parity (G-SANDBOX): runs in an ephemeral container with TEST keys only.
# Live TossPayments credentials are never available to CI.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (pnpm@10.x). Do NOT also set `version:`
      # here — pnpm/action-setup@v4 errors on a dual spec (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Full machine gate: lint + typecheck + unit tests + executable guardrails.
      - run: pnpm check

      # Eval harness (reports purchase-flow metrics; does not fail the build yet).
      - run: pnpm eval

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          CI: "true"
          APP_ENV: test
          TOSS_SECRET_KEY: test_sk_ci_placeholder
          NEXT_PUBLIC_TOSS_CLIENT_KEY: test_ck_ci_placeholder
