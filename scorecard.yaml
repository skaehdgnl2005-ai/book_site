harness_id: "storybook-shop"
loop_iteration: 1
task_spec_ref: "PRODUCT_BRIEF.md"
metric_kind: "harness_readiness"   # measures the MACHINERY, not product delivery — read with `pnpm status` (G1)

# Rubric: docs/method/harness_engineering_rubric.md  (scale 0..3; weights sum 100)
gates: # 8/8 PASS
  G-SIMPLE:  { status: PASS, evidence: "Simplest skeleton first (0 feature code); single-deployable Next app; no multi-agent framework; worker≠checker is a pass not a crew (ADR-0005)." }
  G-GROUND:  { status: PASS, evidence: "passes:true gated on real tool output — pnpm check + Playwright E2E; init.sh runs the real verify. No progress claimed without env feedback." }
  G-TERM:    { status: PASS, evidence: "WIP=1; explicit done definition; budgets (p95<2s, step/cost); blocked state + no-progress→escalate in AGENTS.md." }
  G-ERR:     { status: PASS, evidence: "parseEnv fail-fast model-readable; check-constraints structured JSON; traced() captures+rethrows errors into the loop." }
  G-HITL:    { status: PASS, evidence: "requireApproval() default-deny (tested) + pnpm approve + constraints R3 + docs/SAFETY.md irreversible-action list." }
  G-SANDBOX: { status: PASS, evidence: "docker-compose isolated DB (scoped user); secrets env-only; .env gitignored; CI container with TEST keys; pnpm check needs no DB/secrets." }
  G-EVAL:    { status: PASS, evidence: "Definitive pass/fail via pnpm check + E2E + feature_list verification; eval harness reports purchase-flow metrics." }
  G-TRACE:   { status: PASS, evidence: "observability.ts emits one JSON line per step/tool/error with sessionId+durationMs; Playwright trace on retry." }

categories:
  A_loop_control:      { weight: 15, scores: {A1: 2, A2: 3, A3: 3, A4: 3, A5: 2},        fraction: 0.867, points: 13.00, floor_ok: true }
  B_tools_aci:         { weight: 16, scores: {B1: 3, B2: 3, B3: 3, B4: 2, B5: 3, B6: 2}, fraction: 0.889, points: 14.22, floor_ok: true }
  C_context_eng:       { weight: 15, scores: {C1: 3, C2: 3, C3: 3, C4: 2, C5: 2, C6: 3}, fraction: 0.889, points: 13.33, floor_ok: true }
  D_error_recovery:    { weight: 12, scores: {D1: 3, D2: 2, D3: 2, D4: 3},               fraction: 0.833, points: 10.00, floor_ok: true }
  E_safety_guardrails: { weight: 12, scores: {E1: 3, E2: 3, E3: 3, E4: 2, E5: 3},        fraction: 0.933, points: 11.20, floor_ok: true }
  F_state_memory:      { weight: 8,  scores: {F1: 3, F2: 3, F3: 3},                       fraction: 1.000, points: 8.00,  floor_ok: true }
  G_evaluation:        { weight: 14, scores: {G1: 2, G2: 2, G3: 2, G4: 3, G5: 2, G6: 2}, fraction: 0.722, points: 10.11, floor_ok: true }
  H_observability_ops: { weight: 8,  scores: {H1: 2, H2: 2, H3: 2},                       fraction: 0.667, points: 5.33,  floor_ok: true }

overall_score: 85.2        # HARNESS readiness only (not product delivery)
status: READY               # gates all PASS · all floors ≥ 0.60 · 80 ≤ 85.2 < 90

product_delivery:           # the actual store — read via `pnpm status`. NOT part of the harness score.
  product_features_passing: 1
  product_features_total: 21
  pct: 5
  note: "Buyer flow (catalog→checkout→orders→admin) essentially unbuilt. A high harness score ≠ a shipped store."

robust_gate:                # anti-Goodhart: ROBUST needs real features, not just more machinery
  rule: "ROBUST(≥90) requires overall≥90 AND core buyer-flow features (F002–F008, F011) passing."
  available_now: false
  reason: "product_delivery ~5%; ROBUST withheld regardless of machinery polish."

top_deficits: []            # status READY → loop stops (rubric §5).
evidence_notes: >
  All 8 hard gates PASS; lowest category floor H=0.667 (≥0.60). Scoring is evidence-backed and
  deliberately conservative: criteria with partial/pending implementation (most of G/H, D2/D3,
  B4/B6, C4/C5, A1/A5, E4) are held at 2, tested/complete capabilities at 3. Safety (E=0.933) and
  state (F=1.0) are strongest, as required for a payments+PII domain.
  Review hardening (2026-06-01): A5's no-progress detection is now EXECUTABLE (R5 attempt counter
  forces 'blocked' after 3 tries), and R4 enforces state⟺passes — but the A5 score is held at 2
  this cycle on purpose: not inflating the headline in response to feedback about the headline
  (Goodhart). The number is HARNESS readiness; product delivery is tracked separately and gates
  ROBUST. Re-rate A5 independently next cycle once the agent-side replan loop exists.
